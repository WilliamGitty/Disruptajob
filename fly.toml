# Fly.io deployment.
#
# Chosen because the app stores its database as a file: Fly gives a real persistent volume, so
# SQLite works unchanged. On Vercel or Netlify the filesystem is ephemeral and the database would
# be wiped on every deploy.
#
# Rename `app` to something unique before the first deploy — Fly app names are global.

app = "disruptajob"
primary_region = "lhr"  # London, closest to the users this is built for

[build]
  dockerfile = "Dockerfile"

[env]
  # Must match the mount below: the database belongs on the volume, never in the image.
  DISRUPTAJOB_DB = "/data/disruptajob.db"

[[mounts]]
  source = "disruptajob_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # A single always-on machine. SQLite is a file held open by one process, so this must not be
  # scaled horizontally without moving to a client/server database first.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
