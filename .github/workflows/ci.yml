name: CI

# Runs on every push and every pull request, so a broken main branch is visible within a minute
# rather than on the next deploy. Free for public repositories, and needs no secrets — the whole
# application runs from `npm ci` with no external services, which is what makes this possible.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 is a hard floor, not a preference: the app uses node:sqlite, and the tests rely on
          # native TypeScript type stripping. Neither exists in 20.
          node-version: 22
          cache: npm

      - run: npm ci

      # Next generates route and layout types into .next/types. A fresh checkout has no .next, so
      # typecheck fails on names like LayoutProps that exist locally only because dev has run.
      # This is the whole reason CI earns its place: it runs the way a new machine does.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Catches what the three above cannot: a schema or import error that only appears when Next
      # actually compiles every route. The onboarding bug that shipped a broken migration would
      # have been caught here.
      - name: Production build
        run: npm run build
        env:
          DISRUPTAJOB_DB: ":memory:"

  # Deploys main to Fly once checks pass, so changes built from any machine — including a phone
  # via Claude Code on the web — reach the live site without a laptop in the loop. The token is
  # a deploy-scoped Fly token (repo Settings → Secrets → Actions → FLY_API_TOKEN); it can deploy
  # this one app and nothing else. Skipped entirely on pull requests and forks, where the secret
  # is absent.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # One deploy at a time, newest wins — two merges in quick succession must not race.
      group: fly-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
